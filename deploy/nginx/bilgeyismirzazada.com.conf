# Reference Nginx server block for bilgeyismirzazada.com
#
# This file is NOT read automatically — copy the contents into the server's
# own Nginx config (usually /etc/sites-available/bilgeyismirzazada.com) and
# reload Nginx. If Certbot already manages this file, only add/replace the
# `location` blocks below inside your existing 443 server block — keep your
# existing `ssl_certificate` / `ssl_certificate_key` / redirect lines as-is.
#
# Routing:
#   /api/, /uploads/, /notificationHub  -> .NET API container  (127.0.0.1:5118)
#   everything else (/, /admin, /team)  -> Next.js container   (127.0.0.1:3000)

server {
    listen 80;
    server_name bilgeyismirzazada.com www.bilgeyismirzazada.com;
    return 301 https://www.bilgeyismirzazada.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bilgeyismirzazada.com www.bilgeyismirzazada.com;

    ssl_certificate /etc/letsencrypt/live/bilgeyismirzazada.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bilgeyismirzazada.com/privkey.pem;

    # Video/animasiya yüklənmələri üçün böyük body limiti (API-dəki limitlə uyğun)
    client_max_body_size 500M;

    # ASP.NET Core API
    location /api/ {
        proxy_pass http://127.0.0.1:5118;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 500M;
    }

    # API tərəfindən wwwroot/uploads-dan verilən media fayllar
    location /uploads/ {
        proxy_pass http://127.0.0.1:5118;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (canlı çat) - WebSocket upgrade dəstəyi tələb olunur
    location /notificationHub {
        proxy_pass http://127.0.0.1:5118;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }

    # Next.js — public sayt, /admin, /team (qalan hər şey)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
